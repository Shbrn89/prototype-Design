<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>TokoGaris Mobile – Lupa Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div class="phone-wrap">
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <span class="status-icons">
        <svg viewBox="0 0 20 11" fill="currentColor"><rect x="0" y="6" width="3" height="5"/><rect x="5" y="4" width="3" height="7"/><rect x="10" y="2" width="3" height="9"/><rect x="15" y="0" width="3" height="11"/></svg>
        <svg viewBox="0 0 24 11" fill="currentColor"><rect x="1" y="1" width="20" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="2.5" width="15" height="6" rx="1"/><rect x="22" y="4" width="1.5" height="3"/></svg>
      </span>
    </div>
    <div class="phone-logo-row">
      <div class="logo">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 20L15 4l5 5-11 11H4v-5z"/></svg>
        </span>
        TokoGaris
      </div>
    </div>

    <div class="phone-image-banner">
      <div class="moodboard">
        <div class="swatch sw-tan" style="width:70px;height:50px;top:14px;left:16px;transform:rotate(-5deg);"></div>
        <div class="swatch sw-olive" style="width:30px;height:30px;top:60px;left:100px;border-radius:50%;"></div>
      </div>
    </div>

    <div class="phone-form">
      <h1 class="form-heading">Lupa Password?</h1>
      <p class="form-subtext">Masukkan email Anda, kami akan mengirimkan link untuk mengatur ulang password.</p>

      <div class="field">
        <label>Email atau nomor telepon</label>
        <div class="input-wrap">
          <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          <input type="text" placeholder="nama@email.com" />
        </div>
      </div>

      <button class="btn btn-primary">Kirim Link Reset</button>

      <a href="mobile-login.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Kembali ke login
      </a>
    </div>
  </div>
</div>

</body>
</html>
