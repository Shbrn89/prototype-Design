<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>DesignNest – Lupa Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div class="page-center">
  <div class="auth-shell">
    <div class="auth-shell-inner">

      <!-- LEFT: moodboard image panel -->
      <div class="auth-panel-image">
        <div class="moodboard">
          <div class="swatch sw-paper" style="width:150px;height:170px;top:16px;left:26px;transform:rotate(-3deg);"></div>
          <div class="swatch sw-olive" style="width:60px;height:60px;top:70px;left:170px;border-radius:50%;"></div>
          <div class="swatch sw-tan" style="width:90px;height:60px;top:170px;left:150px;transform:rotate(6deg);"></div>
          <svg class="sketch-svg" style="top:35px;left:40px;width:120px;height:160px;" viewBox="0 0 100 140" fill="none" stroke="#4b5140" stroke-width="1.2">
            <path d="M35 15 L50 5 L65 15 L62 45 L68 120 L52 128 L48 95 L45 128 L30 120 L36 45 Z"/>
          </svg>

          <div class="polaroid" style="bottom:40px;left:40px;transform:rotate(-6deg);">
            <div class="polaroid-img" style="background:#8d8565;"></div>
            Reset Your Password
          </div>
        </div>
      </div>

      <!-- RIGHT: form panel -->
      <div class="auth-panel-form">
        <div class="logo">
          <span class="logo-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 20L15 4l5 5-11 11H4v-5z"/></svg>
          </span>
          DesignNest
        </div>

        <h1 class="form-heading">Lupa Password?</h1>
        <p class="form-subtext">Masukkan email Anda, kami akan mengirimkan link untuk mengatur ulang password.</p>

        <div class="field">
          <label>Email atau nomor telepon</label>
          <div class="input-wrap">
            <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <input type="text" placeholder="nama@email.com" />
          </div>
        </div>

        <button class="btn btn-primary">Kirim Link Reset</button>

        <a href="login.html" class="back-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
          Kembali ke login
        </a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
