<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>DesignNest – Daftar Desainer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div class="page-center">
  <div class="auth-shell">
    <div class="auth-shell-inner">

      <!-- LEFT: moodboard image panel -->
      <div class="auth-panel-image">
        <div class="moodboard">
          <div class="swatch sw-paper" style="width:150px;height:120px;top:16px;left:26px;transform:rotate(3deg);"></div>
          <div class="swatch sw-tan" style="width:70px;height:70px;top:120px;left:170px;border-radius:50%;"></div>
          <div class="swatch sw-charcoal" style="width:50px;height:90px;top:40px;left:190px;border-radius:8px;"></div>
          <svg class="sketch-svg" style="top:40px;left:40px;width:130px;height:150px;" viewBox="0 0 100 130" fill="none" stroke="#4b5140" stroke-width="1.2">
            <path d="M30 10 L50 2 L70 10 L66 40 L72 115 L54 122 L50 90 L46 122 L28 115 L34 40 Z"/>
          </svg>
          <!-- pencil accent -->
          <div class="swatch" style="width:4px;height:70px;background:#2c2a26;top:200px;left:60px;transform:rotate(35deg);border-radius:3px;"></div>
        </div>
        <div class="image-copy">
          <h1>Jual Karyamu, Raih Penghasilan</h1>
          <p>Gabung bersama desainer terbaik di seluruh UMKM fashion.</p>
        </div>
      </div>

      <!-- RIGHT: form panel -->
      <div class="auth-panel-form">
        <div class="logo">
          <span class="logo-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 20L15 4l5 5-11 11H4v-5z"/></svg>
          </span>
          DesignNest
        </div>

        <h1 class="form-heading" style="font-size:21px;">Daftar sebagai Desainer</h1>
        <p class="form-subtext">Mulai jual produk desain fashion dan kelola kreativitas dengan mudah.</p>

        <div class="field">
          <label>Nama lengkap</label>
          <div class="input-wrap">
            <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
            <input type="text" placeholder="Nama lengkap" />
          </div>
        </div>

        <div class="field">
          <label>Email</label>
          <div class="input-wrap">
            <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <input type="text" placeholder="nama@email.com" />
          </div>
        </div>

        <div class="field">
          <label>Nomor telepon</label>
          <div class="input-wrap">
            <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 16.9v2a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3 19.5 19.5 0 01-6-6A19.8 19.8 0 013.1 4.2 2 2 0 015.1 2h2a2 2 0 012 1.7c.1.9.3 1.8.6 2.6a2 2 0 01-.5 2.1l-.9.9a16 16 0 006 6l.9-.9a2 2 0 012.1-.5c.8.3 1.7.5 2.6.6a2 2 0 011.7 2z"/></svg>
            <input type="text" placeholder="08xx-xxxx-xxxx" />
          </div>
        </div>

        <div class="field">
          <label>Password</label>
          <div class="input-wrap">
            <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
            <input type="password" placeholder="••••••••" />
            <svg class="icon-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
        </div>

        <div class="field">
          <label>Konfirmasi password</label>
          <div class="input-wrap">
            <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
            <input type="password" placeholder="••••••••" />
            <svg class="icon-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
        </div>

        <p class="section-label">Biodata Desainer (opsional)</p>

        <div class="field">
          <label>Nama brand / studio</label>
          <div class="input-wrap">
            <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg>
            <input type="text" placeholder="Nama brand atau studio" />
          </div>
        </div>

        <div class="field">
          <label>Jenis desainer</label>
          <div class="input-wrap">
            <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l9 4.9v8.2L12 22l-9-4.9V6.9z"/></svg>
            <select>
              <option>Pilih salah satu</option>
              <option>Desainer Independen</option>
              <option>Brand / Label</option>
              <option>Studio Desain</option>
            </select>
          </div>
        </div>

        <button class="btn btn-primary" style="margin-top:4px;">Daftar</button>

        <div class="divider">atau</div>

        <div class="social-stack">
          <button class="btn btn-outline">
            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.82-.07-1.42-.22-2.05H12v3.9h6.6c-.13 1.1-.86 2.75-2.47 3.86l-.02.15 3.59 2.78.25.02c2.28-2.1 3.57-5.2 3.57-8.66z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.93-2.9l-3.86-2.98c-1.05.73-2.46 1.24-4.07 1.24-3.11 0-5.74-2.1-6.68-4.93l-.14.01-3.73 2.89-.05.14C3.4 21.3 7.36 24 12 24z"/><path fill="#FBBC05" d="M5.32 14.43A7.4 7.4 0 014.9 12c0-.85.15-1.67.41-2.43L5.3 9.4 1.5 6.44l-.13.06A11.98 11.98 0 000 12c0 1.93.47 3.76 1.3 5.37l4.02-2.94z"/><path fill="#EA4335" d="M12 4.75c2.25 0 3.77.97 4.64 1.79l3.39-3.31C17.95 1.19 15.24 0 12 0 7.36 0 3.4 2.7 1.5 6.44l3.8 2.95C6.26 6.85 8.89 4.75 12 4.75z"/></svg>
            Daftar dengan Google
          </button>
          <button class="btn btn-outline">
            <svg viewBox="0 0 24 24" fill="#111"><path d="M16.37 1.43c.1 1.02-.3 2.02-.93 2.76-.65.76-1.72 1.35-2.76 1.27-.12-1 .35-2.04.98-2.76.68-.78 1.86-1.37 2.71-1.27zM20.6 17.1c-.5 1.14-.75 1.64-1.4 2.63-.9 1.37-2.17 3.08-3.74 3.1-1.4.02-1.76-.9-3.65-.9-1.9 0-2.3.88-3.68.92-1.5.05-2.65-1.46-3.56-2.82-1.9-2.86-3.35-8.07-1.4-11.6.97-1.75 2.71-2.87 4.6-2.9 1.47-.02 2.37.98 3.64.98 1.27 0 2.1-.98 3.65-.95 1.6.03 3.28.9 4.3 2.44-3.79 2.3-3.17 7.3.24 9.1z"/></svg>
            Daftar dengan Apple
          </button>
        </div>

        <p class="footer-note">Sudah punya akun? <a href="login.html" class="link-strong">Masuk di sini</a></p>
      </div>
    </div>
  </div>
</div>

</body>
</html>
